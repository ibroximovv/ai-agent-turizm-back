[project]
name = "ai-agent-turizm-back"
version = "1.0.0"
description = "AI Agent Turizm — backend API, admin panel and document grounding pipeline"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    # Admin panel theme
    "django-unfold>=0.107",
    # Pipeline
    "httpx>=0.28",
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "mammoth>=1.9",
    "regex>=2024.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    # Django models legitimately use mutable class attributes.
    "RUF012",
    # This codebase is *about* Uzbek Cyrillic and Latin text: apostrophe
    # variants (ʼ ‘ ’) and Cyrillic letters inside string literals are the
    # subject matter, not a typo.
    "RUF001",
    "RUF002",
    "RUF003",
    # Several columns are nullable to match the inherited TypeORM schema,
    # where the distinction between NULL and '' already exists in the data.
    "DJ001",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
