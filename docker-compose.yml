services:
  postgres:
    image: postgres:16-alpine
    container_name: turizm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-turizm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-turizm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turizm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY majburiy}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-turizm_db}
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-true}
      PIPELINE_CONCURRENCY: ${PIPELINE_CONCURRENCY:-2}
      OWUI_URL: ${OWUI_URL:-http://localhost:8080}
      OWUI_API_KEY: ${OWUI_API_KEY:-}
      OWUI_TIMEOUT_MS: ${OWUI_TIMEOUT_MS:-30000}
    # Migrations run at boot so a fresh deploy needs no extra step. On a
    # database inherited from the TypeORM service, run `adopt_legacy_schema`
    # first and swap this for `migrate --fake-initial` (see README).
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 1 --threads 8 --timeout 120 --access-logfile -"
    ports:
      - "${PORT:-3005}:8000"
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
