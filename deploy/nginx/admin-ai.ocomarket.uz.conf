# ---------------------------------------------------------------------------
# AI Agent Turizm — admin panel + API
#
#   sudo cp deploy/nginx/admin-ai.ocomarket.uz.conf \
#           /etc/nginx/sites-available/admin-ai.ocomarket.uz
#   sudo ln -s /etc/nginx/sites-available/admin-ai.ocomarket.uz \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS block:
#   sudo certbot --nginx -d admin-ai.ocomarket.uz
# ---------------------------------------------------------------------------

upstream turizm_backend {
    # Must match --bind in deploy/ecosystem.config.js. Loopback only: nginx is
    # the single entry point, gunicorn is never exposed directly.
    server 127.0.0.1:3005 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin-ai.ocomarket.uz;

    # Certbot writes its challenge here; keep it above the proxy_pass.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- uploads -----------------------------------------------------------
    # MAX_UPLOAD_MB is 200; the extra headroom covers the multipart envelope.
    # Without this nginx answers 413 before Django ever sees the request.
    client_max_body_size 210m;
    client_body_buffer_size 1m;
    client_body_timeout 300s;

    # ---- proxy timeouts ----------------------------------------------------
    # Conversion itself runs on a background thread, so requests are short —
    # but a 200 MB upload on a slow link is not.
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ---- logs --------------------------------------------------------------
    access_log /var/log/nginx/turizm-access.log;
    error_log  /var/log/nginx/turizm-error.log;

    # ---- static files ------------------------------------------------------
    # `manage.py collectstatic` fills this directory. WhiteNoise could serve
    # them too, but nginx does it without waking a Python thread.
    location /static/ {
        alias /var/www/ai-agent-turizm-back/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Raw documents and generated Markdown are internal — they are read through
    # the admin panel, never served straight off disk. No /media/ block here on
    # purpose.

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ---- application -------------------------------------------------------
    location / {
        proxy_pass http://turizm_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this via SECURE_PROXY_SSL_HEADER; without it the admin's
        # CSRF check sees "http" behind TLS and rejects every form post.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        # Buffer the request body to disk before handing it over, so gunicorn's
        # single worker is not held open by a slow uploader.
        proxy_request_buffering on;
    }

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- hardening ---------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
